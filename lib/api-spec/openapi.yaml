openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Phase 1 PDF upload and extraction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /reports/extract:
    post:
      operationId: extractReport
      tags: [reports]
      summary: Extract financial information from an uploaded PDF report
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReportUploadInput"
      responses:
        "201":
          description: PDF extracted and analysis saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReport"
        "400":
          description: Invalid PDF upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The PDF has no usable text or no verifiable report content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Required persistence service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{reportId}:
    get:
      operationId: getFinancialReport
      tags: [reports]
      summary: Retrieve a saved extraction for review
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved financial report extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReport"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{reportId}/explanations:
    post:
      operationId: generateReportExplanations
      tags: [reports]
      summary: Generate or retrieve bilingual, source-grounded explanations for a saved report
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bilingual explanations generated from verified report evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BilingualExplanationBundle"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Explanation service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReportUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Text-based PDF financial report, up to 15 MB
    FinancialMetric:
      type: object
      required:
        - label
        - category
        - reportedValue
        - currency
        - unitScale
        - reportingPeriod
        - sourcePage
        - sourceExcerpt
        - verificationStatus
      properties:
        label:
          type: string
        category:
          type: string
          enum: [revenue, net_profit, assets, liabilities, equity, other]
        reportedValue:
          type: ["string", "null"]
          description: Exact text value as reported; null when unavailable
        currency:
          type: ["string", "null"]
        unitScale:
          type: string
          enum: [units, thousands, millions, unknown]
        reportingPeriod:
          type: ["string", "null"]
        sourcePage:
          type: ["integer", "null"]
        sourceExcerpt:
          type: ["string", "null"]
        verificationStatus:
          type: string
          enum: [verified, unverified, unavailable]
    FinancialReport:
      type: object
      required:
        - id
        - originalFileName
        - companyName
        - reportingPeriod
        - currency
        - unitScale
        - metrics
        - extractionNotes
        - explanations
        - createdAt
      properties:
        id:
          type: string
        originalFileName:
          type: string
        companyName:
          type: ["string", "null"]
        reportingPeriod:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        unitScale:
          type: string
          enum: [units, thousands, millions, unknown]
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/FinancialMetric"
        extractionNotes:
          type: array
          items:
            type: string
        explanations:
          oneOf:
            - $ref: "#/components/schemas/BilingualExplanationBundle"
            - type: "null"
        createdAt:
          type: string
          format: date-time
    BilingualExplanationItem:
      type: object
      required:
        - metricIndex
        - category
        - meaningEnglish
        - meaningArabic
        - contextEnglish
        - contextArabic
        - sourcePage
      properties:
        metricIndex:
          type: integer
          minimum: 0
        category:
          type: string
          enum: [revenue, net_profit, assets, liabilities, equity, other]
        meaningEnglish:
          type: string
        meaningArabic:
          type: string
        contextEnglish:
          type: string
        contextArabic:
          type: string
        sourcePage:
          type: ["integer", "null"]
    BilingualExplanationBundle:
      type: object
      required: [summaryEnglish, summaryArabic, items, generatedAt]
      properties:
        summaryEnglish:
          type: string
        summaryArabic:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BilingualExplanationItem"
        generatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

